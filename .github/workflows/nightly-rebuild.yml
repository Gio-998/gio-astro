# Publishes the new day's horoscopes. The site is a static export, so nothing changes until it is rebuilt.
name: Nightly rebuild
on:
  schedule:
    - cron: "10 23 * * *" # 00:10 in Skopje in winter, 01:10 in summer
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 30 -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bing, Yandex, Seznam and Naver only. Google does not use IndexNow and finds new pages through the sitemap.
      - name: Tell IndexNow what changed
        continue-on-error: true
        run: node scripts/indexnow.mjs --send
